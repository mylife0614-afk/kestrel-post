<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Post — Alpine Courier Run</title>
<meta name="description" content="Kestrel Post is a free offline browser flight game: fly mail through alpine rings, mind your fuel, and land on the runway.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0f1a;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    background: #0a0f1a;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<noscript><p style="color:#cfe8ff;text-align:center">Kestrel Post needs JavaScript to fly.</p></noscript>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/input.js"></script>
<script src="src/physics.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
